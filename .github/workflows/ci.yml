name: "CI"

on:
  pull_request:

jobs:
  ci:
    name: "CI"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Compile
        run: ./gradlew assemble

      - name: Run tests
        run: ./gradlew test