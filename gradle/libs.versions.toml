[versions]
kotlin = "2.4.0"
# Language/API version for published artifacts — keeps Kotlin 2.0+ consumers compatible.
kotlin-language = "2.0"
dokka = "2.0.0"
javalin = "7.2.2"
slf4j = "2.0.16"
junit-bom = "5.11.4"
assertj = "3.27.3"
mockk = "1.14.2"
nimbus-jose-jwt = "10.9.1"
auth0-java-jwt = "4.6.0"
auth0-jwks-rsa = "0.24.1"
vanniktech-maven-publish = "0.34.0"
kover = "0.9.9"

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-testtools = { module = "io.javalin:javalin-testtools", version.ref = "javalin" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
auth0-java-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0-java-jwt" }
auth0-jwks-rsa = { module = "com.auth0:jwks-rsa", version.ref = "auth0-jwks-rsa" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
